version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sentinel_password_2026
      POSTGRES_DB: sentinel_x
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-runner
    container_name: sentinel-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      CLIENT_URL: "http://localhost:5173"
      DATABASE_URL: "postgresql://postgres:sentinel_password_2026@postgres:5432/sentinel_x?schema=public"
      JWT_SECRET: "sentinel-x-ultra-secure-clearance-jwt-key-2026-alpha-7"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
    container_name: sentinel-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
